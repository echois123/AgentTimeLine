    .page {

    .header {

    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -0.03em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 1120px;
    }

    .legend {
      display: flex;
      gap: 12px;
      margin: 16px 0 14px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(30, 33, 40, 0.08);
      font-size: 13px;
      color: var(--ink);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dot);
    }

    .table-wrap {
      overflow: auto;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(30, 33, 40, 0.08);
      box-shadow: 0 16px 40px rgba(24, 29, 39, 0.08);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 1080px;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(248, 248, 249, 0.98);
      backdrop-filter: blur(10px);
      font-size: 13px;
      text-align: left;
      color: var(--muted);
      padding: 14px 14px;
      border-bottom: 1px solid var(--line);
    }

    tbody th,
    tbody td {
      vertical-align: top;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    tbody th {
      width: 126px;
      min-width: 126px;
      background: rgba(248, 248, 249, 0.72);
      font-size: 13px;
      font-weight: 700;
      color: #39404c;
      position: sticky;
      left: 0;
      z-index: 1;
    }

    td {
      width: 50%;
      background: rgba(255, 255, 255, 0.55);
    }

    .cell-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      border-radius: 16px;
      background: color-mix(in srgb, var(--accent) 14%, white);
      border: 1px solid color-mix(in srgb, var(--accent) 24%, white);
      padding: 12px 12px 10px;
      min-height: 74px;
    }

    .card .title {
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1a1e25;
    }

    .card .summary {
      font-size: 12px;
      line-height: 1.55;
      color: #53606e;
    }

    .text-event {
      padding: 2px 2px 1px;
    }

    .text-event .title {
      display: inline;
      font-size: 13px;
      font-weight: 700;
      color: #20242b;
    }

    .text-event .summary {
      display: inline;
      margin-left: 8px;
      font-size: 12px;
      line-height: 1.65;
      color: #6b7482;
    }

    .empty {
      color: #a2a8b3;
      text-align: center;
      font-size: 13px;
      background: rgba(250, 250, 250, 0.75);
    }

    .row-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;

    const body = document.getElementById("timeline-body");

    const renderEvent = (event, productKey) => {
      if (event.importance >= 4) {
        return `
          <article class="card" style="--accent:${PRODUCTS[productKey].color};">
            <div class="title">${escapeHtml(event.title)}</div>
            <div class="summary">${escapeHtml(event.summary)}</div>
          </article>
        `;
      }
      return `
        <div class="text-event">
          <span class="title">${escapeHtml(event.title)}</span>
          <span class="summary">${escapeHtml(event.summary)}</span>
        </div>
      `;
    };

    const renderCell = (events, productKey) => {
      if (!events.length) return '<td class="empty">-</td>';
      return `<td><div class="cell-stack">${events.map((event) => renderEvent(event, productKey)).join("")}</div></td>`;
    };

    body.innerHTML = ROWS.map((row) => `
      <tr>
        <th>${row.date}</th>
        ${renderCell(row.codex, "codex")}
        ${renderCell(row.claude, "claude")}
      </tr>
    `).join("");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
